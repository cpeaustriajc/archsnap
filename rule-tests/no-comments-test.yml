id: no-comments
valid:
  - let s = "// not a comment";
  - let s = "/* not a comment */";
  - let s = "/// not a doc";
  - let s = "//! not a doc";
  - let s = "a \" // still a string";
  - let s = r#"// "quoted" /* x */"#;
  - let s = r##"a "# // b"##;
  - let c = '/';
  - let u = 1 / 2;
  - let d = a / *b;
  - |
    fn f() {
        let x = "/*";
        let y = "*/";
    }
  - |
    #[doc = "an attribute, not a comment"]
    fn f() {}
  - 'let url = "https://example.com/a";'
invalid:
  - "// line"
  - "/* block */"
  - "/* outer /* nested */ still outer */"
  - "/// outer doc"
  - "//! inner doc"
  - "/** block doc */"
  - "/*! inner block doc */"
  - "//"
  - "/**/"
  - |
    fn f() {
        x(); // trailing
    }
  - |
    fn f() {
        let s = "// string";
        // real
    }
  - |
    fn f(
        a: u8, // why
    ) {}
  - |
    mac! { fn g() {} // inside macro
    }
  - |
    #[derive(Debug)] // on an attribute
    struct S;
  - |
    /// on a field
    struct S { a: u8 }
