[package]
name = "archsnap"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
oxc_allocator = "0.152.0"
oxc_ast = "0.152.0"
oxc_ast_visit = "0.152.0"
oxc_diagnostics = "0.152.0"
oxc_parser = "0.152.0"
oxc_span = "0.152.0"
oxc_syntax = "0.152.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
dead_code = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
wildcard_enum_match_arm = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"
shadow_unrelated = "deny"
shadow_reuse = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
cognitive_complexity = "deny"
needless_pass_by_ref_mut = "deny"
