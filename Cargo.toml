[package]
name = "archsnap"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
oxc_allocator = "0.152.0"
oxc_ast = "0.152.0"
oxc_diagnostics = "0.152.0"
oxc_parser = "0.152.0"
oxc_span = "0.152.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
