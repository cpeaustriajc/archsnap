[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "tasks/benchmark", "tasks/break_it", "tasks/models"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
earnest_ast = { path = "crates/earnest_ast", version = "0.1.0" }
earnest_chart = { path = "crates/earnest_chart", version = "0.1.0" }
earnest_check = { path = "crates/earnest_check", version = "0.1.0" }
earnest_diagnostics = { path = "crates/earnest_diagnostics", version = "0.1.0" }
earnest_ir = { path = "crates/earnest_ir", version = "0.1.0" }
earnest_macros = { path = "crates/earnest_macros", version = "0.1.0" }
earnest_rs = { path = "crates/earnest_rs", version = "0.1.0" }
earnest_semantic = { path = "crates/earnest_semantic", version = "0.1.0" }
earnest_tla = { path = "crates/earnest_tla", version = "0.1.0" }
earnest_ts = { path = "crates/earnest_ts", version = "0.1.0" }
earnest_value = { path = "crates/earnest_value", version = "0.1.0" }

clap = { version = "4.6.7", features = ["derive"] }
hashbrown = { version = "0.17.1", default-features = false, features = ["inline-more"] }
oxc_allocator = "0.152.0"
oxc_ast = "0.152.0"
oxc_parser = "0.152.0"
oxc_span = "0.152.0"
oxc_syntax = "0.152.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "2.0.119", features = ["full", "extra-traits"] }
vstd = "=0.0.0-2026-11-01-0251"

assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
missing_assert_message = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"

exhaustive_enums = "warn"

string_add = "warn"
wildcard_imports = "warn"

dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
