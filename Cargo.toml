[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
earnest_chart = { path = "crates/earnest_chart" }
earnest_check = { path = "crates/earnest_check" }
earnest_macros = { path = "crates/earnest_macros" }
earnest_rs = { path = "crates/earnest_rs" }
earnest_tla = { path = "crates/earnest_tla" }
earnest_ts = { path = "crates/earnest_ts" }

clap = { version = "4.6.7", features = ["derive"] }
oxc_allocator = "0.152.0"
oxc_ast = "0.152.0"
oxc_parser = "0.152.0"
oxc_span = "0.152.0"
oxc_syntax = "0.152.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "2.0.119", features = ["full", "extra-traits"] }
vstd = "=0.0.0-2026-11-01-0251"

assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
dead_code = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
wildcard_enum_match_arm = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"
shadow_unrelated = "deny"
shadow_reuse = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
cognitive_complexity = "deny"
needless_pass_by_ref_mut = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
